services:
  - type: web
    name: mehngai-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BRIGHTDATA_API_KEY
        sync: false
      - key: COLLECTOR_IDS
        sync: false
      - key: PIPELINE_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
